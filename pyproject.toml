[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsolve-rbac-rag"
version = "0.1.0"
description = "RAG chatbot with role-based access control for FinSolve Technologies"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies. More are added phase by phase (vector DB, embeddings, LLM...).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Developer tooling: install with  pip install -e ".[dev]"
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",        # used by FastAPI's TestClient
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------- Ruff: linter + formatter ----------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle errors / warnings
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "N",        # naming conventions
    "SIM",      # simplifications
    "S",        # bandit security checks
]
ignore = ["B008"]  # FastAPI uses function calls in defaults (Depends)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------- Mypy: static type checking ----------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette suggests a newer test HTTP client; harmless, revisit later.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
