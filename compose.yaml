# The whole system with one command:
#   cp .env.example .env        # then set LLM_API_KEY (and SEED_USER_PASSWORD)
#   docker compose up --build
# UI: http://localhost:8501   API docs: http://localhost:8000/docs
#
# Start-up order (each step waits for the previous one):
#   qdrant (healthy) -> init: seed users + index documents (exits 0)
#   -> api (healthy: /health/ready) -> ui
name: finsolve

x-api-environment: &api-environment
  # Overrides for containers; everything else comes from .env.
  QDRANT_URL: http://qdrant:6333
  USER_DB_PATH: var/users.db
  AUDIT_LOG_PATH: var/audit.log

services:
  qdrant:
    image: qdrant/qdrant:v1.20.1
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl; bash can open a TCP connection itself.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init:
    # One-shot job: create/refresh demo users and (incrementally) index data/.
    build: { context: ., target: api }
    image: finsolve-api
    env_file: .env
    environment: *api-environment
    command: ["sh", "-c", "python -m app.auth.manage seed && python -m app.ingestion.pipeline"]
    volumes:
      - app_var:/app/var
    depends_on:
      qdrant: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    image: finsolve-api
    env_file: .env
    environment: *api-environment
    ports:
      - "8000:8000"
    volumes:
      - app_var:/app/var  # users.db and audit.log survive restarts
    depends_on:
      init: { condition: service_completed_successfully }
    restart: unless-stopped

  ui:
    build: { context: ., target: ui }
    image: finsolve-ui
    environment:
      API_BASE_URL: http://api:8000  # service names are DNS names inside compose
    ports:
      - "8501:8501"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  qdrant_data:
  app_var:
