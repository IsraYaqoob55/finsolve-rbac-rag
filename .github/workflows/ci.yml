# Continuous Integration: runs on every push and pull request.
# A red X on GitHub means something is broken before anyone merges it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,ui]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app ui eval

      # The build fails if coverage drops below 85% (currently ~87%).
      # Live LLM evaluation (eval/answer_eval.py) is run manually: it needs an API key.
      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  # Builds the real images and starts the whole stack with docker compose,
  # then checks readiness, login and RBAC end to end (no LLM tokens needed).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i 's/^LLM_API_KEY=.*/LLM_API_KEY=ci-placeholder-not-used/' .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Smoke test
        run: python3 scripts/smoke_test.py --timeout 300

      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
